services:
  - type: web
    name: emids-portal
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: emids-portal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: emids-portal-db
    databaseName: emidsportal
    user: portal
    plan: basic-256mb
